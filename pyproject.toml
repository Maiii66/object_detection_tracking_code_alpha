[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end tests that load the YOLO model",
]

[tool.coverage.run]
source = ["main", "config", "utils"]
omit = ["venv/*", "tests/*", "verify_env.py"]
